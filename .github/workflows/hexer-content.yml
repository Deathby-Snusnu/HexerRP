name: HexerRP 0.5.0 content
on:
  push:
  pull_request:
jobs:
  hexer-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run HexerRP runtime suite
        run: lua5.4 tests/test_addon.lua
